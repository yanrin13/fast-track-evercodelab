services:
  app:
    build: .
    container_name: crypto-api
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    mem_limit: 512m
    cpus: 1

volumes:
  sqlite_data:
